  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 12% 0%, rgba(201,162,39,0.07), transparent 42%),
      radial-gradient(circle at 88% 8%, rgba(75,46,131,0.08), transparent 45%),
      linear-gradient(180deg, #F7F5F0 0%, #F1EDE2 100%);
    background-attachment:fixed;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding-bottom:60px;
  }
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  header{
    background-image:
      linear-gradient(180deg, rgba(14,12,28,0.55) 0%, rgba(14,12,28,0.35) 45%, rgba(14,12,28,0.72) 100%),
      var(--header-bg);
    background-size:cover;
    background-position:center 30%;
    background-repeat:no-repeat;
    color:#F3EFE3;
    padding:40px 20px 46px;
    position:relative;
    overflow:hidden;
    border-bottom:3px solid var(--gold);
    min-height:190px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
  }
  header::before{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 90% 10%, rgba(201,162,39,0.15), transparent 40%),
      linear-gradient(0deg, rgba(14,12,28,0.55) 0%, rgba(14,12,28,0.05) 60%);
    pointer-events:none;
  }
  header::after{
    content:"";
    position:absolute;left:0;right:0;bottom:-1px;height:3px;
    background:linear-gradient(90deg, transparent, var(--gold-light), transparent);
    opacity:.8;
  }
  header .eyebrow{
    position:relative;
    letter-spacing:.22em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--gold-light);
    font-weight:700;
    text-shadow:0 2px 8px rgba(0,0,0,0.6);
  }
  header h1{
    position:relative;
    margin:8px 0 6px;
    font-size:31px;
    font-weight:700;
    letter-spacing:.01em;
    color:#FBF9F2;
    text-shadow:0 2px 14px rgba(0,0,0,0.65), 0 0 30px rgba(0,0,0,0.4);
  }
  header p.sub{position:relative;margin:0;font-size:13px;color:#EDE8F5;max-width:640px;line-height:1.65;text-shadow:0 1px 8px rgba(0,0,0,0.6);}

  .toolbar{
    max-width:960px;
    margin:-22px auto 0;
    padding:0 16px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    position:relative;
    z-index:5;
  }
  .toolbar > *{flex:1 1 auto;min-width:150px;}
  .search-wrap{position:relative;flex:2 1 260px;}
  input[type=text], input[type=number], select{
    width:100%;
    padding:12px 14px;
    border-radius:11px;
    border:1.5px solid #E3DCC7;
    background:#fff;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    box-shadow:0 2px 10px rgba(27,23,48,0.06);
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,39,0.16);}
  .btn{
    border:none;
    border-radius:11px;
    padding:12px 18px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    box-shadow:var(--shadow);
    white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
    letter-spacing:.01em;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:linear-gradient(135deg, var(--gold-light), var(--gold));color:#2A1F04;box-shadow:var(--shadow-gold);}
  .btn-primary:hover{background:linear-gradient(135deg, var(--gold), #B08A1E);box-shadow:0 10px 26px rgba(201,162,39,0.4);}
  .btn-outline{background:#fff;color:var(--pine-dark);border:1.5px solid #DDD6EE;box-shadow:0 2px 8px rgba(27,23,48,0.06);}
  .btn-outline:hover{background:var(--navy);color:#F3EFE3;border-color:var(--navy);box-shadow:var(--shadow-lg);}
  .btn-ghost{background:transparent;color:var(--ink-soft);box-shadow:none;padding:4px 8px;font-size:12px;text-decoration:underline;}
  .btn-ghost:hover{transform:none;color:var(--pine);}
  .btn-danger{background:#fff;color:#9C3140;border:1.5px solid #EBC7CC;box-shadow:none;}
  .btn-danger:hover{background:#9C3140;color:#fff;border-color:#9C3140;}
  .btn-small{padding:6px 11px;font-size:12px;border-radius:8px;}
  .btn-spouse{
    background:linear-gradient(135deg, var(--pine), var(--pine-dark));
    color:#F3EFE3;
    padding:13px 22px;
    font-size:15px;
    border-radius:12px;
    box-shadow:0 8px 20px rgba(46,27,87,0.32);
  }
  .btn-spouse:hover{background:linear-gradient(135deg, var(--pine-dark), var(--navy-dark));box-shadow:0 12px 28px rgba(46,27,87,0.42);}

  main{max-width:960px;margin:0 auto;padding:30px 16px 10px;}

  .breadcrumbs{margin-bottom:14px;min-height:18px;}
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:11px 20px 11px 16px;
    border:none;
    border-radius:999px;
    background:var(--pine);
    color:#fff;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  .back-btn:hover{transform:translateY(-2px); filter:brightness(1.1);}
  .back-btn:active{transform:translateY(0);}
  .back-btn svg{width:19px;height:19px;flex-shrink:0;}

  .section-label{
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--pine-dark);
    font-weight:700;
    margin:26px 0 10px;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .section-label::before{
    content:"";
    width:20px;height:2px;border-radius:2px;
    background:linear-gradient(90deg, var(--gold), var(--pine));
    display:inline-block;
  }
  .section-label-row{justify-content:space-between;}
  .select-toggle-btn{
    text-transform:none;letter-spacing:normal;font-weight:700;font-size:12.5px;
    background:#fff;color:var(--pine-dark);border:1.5px solid #DDD6EE;border-radius:8px;
    padding:5px 12px;cursor:pointer;box-shadow:0 2px 8px rgba(27,23,48,0.06);
  }
  .select-toggle-btn:hover{background:var(--navy);color:#F3EFE3;border-color:var(--navy);}
  .child-card.selectable{cursor:pointer;}
  .child-card.selected{background:var(--gold-soft);box-shadow:inset 0 0 0 2px var(--gold);}
  .bulk-delete-bar{
    position:sticky;bottom:14px;margin-top:14px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    background:var(--navy);color:#F3EFE3;border-radius:12px;padding:10px 16px;
    box-shadow:var(--shadow-lg);font-size:13px;font-weight:600;
  }
  .bulk-delete-bar .btn-danger{background:#fff;}

  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
  .row.parents{align-items:stretch;}

  .card{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    flex:1 1 220px;
    min-width:200px;
    position:relative;
    border-top:4px solid var(--unknown);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg, transparent, rgba(201,162,39,0.55), transparent);
    opacity:0;transition:opacity .18s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
  .card:hover::before{opacity:1;}
  .card.male{border-top-color:var(--male);}
  .card.female{border-top-color:var(--female);}
  .card .card-head{
    padding:15px 15px 10px;
    display:flex;
    align-items:center;
    gap:11px;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:15px;
    background:linear-gradient(135deg, var(--unknown-soft), #fff);color:var(--unknown);
    flex:none;
    box-shadow:inset 0 0 0 1.5px rgba(201,162,39,0.25);
  }
  .card.male .avatar{background:linear-gradient(135deg, var(--male-soft), #fff);color:var(--male);}
  .card.female .avatar{background:linear-gradient(135deg, var(--female-soft), #fff);color:var(--female);}
  .card .name{font-family:'Fraunces',serif;font-weight:600;font-size:16.5px;line-height:1.2;color:var(--ink);}
  .card .name.clickable{cursor:pointer;}
  .card .name.clickable:hover{color:var(--gold);}
  .card .years{font-size:12px;color:var(--ink-soft);margin-top:2px;font-weight:600;letter-spacing:.01em;}
  .gen-badge{
    display:inline-block;padding:1px 7px;border-radius:20px;
    font-size:10.5px;font-weight:700;letter-spacing:.02em;
    vertical-align:middle;
  }
  .card .card-body{padding:0 15px 12px;font-size:12.5px;color:var(--ink-soft);}
  .card .card-actions{
    display:flex;gap:6px;padding:10px 15px;border-top:1px solid #F1EDDF;flex-wrap:wrap;background:#FBFAF5;
  }
  .card.focus-main{border-width:5px;box-shadow:var(--shadow-lg);}
  .card.focus-main::before{opacity:1;}
  .card.focus-main .name{font-size:20px;}

  .empty-slot{
    flex:1 1 200px;
    min-width:180px;
    border:2px dashed #DACB94;
    border-radius:var(--radius);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    min-height:74px;
    background:rgba(255,255,255,0.5);
    transition:border-color .15s, background .15s;
  }
  .empty-slot:hover{border-color:var(--gold);background:#fff;}

<script>
/* ---------------- Konfigurasi Google Sheets (via Apps Script) ---------------- */
// 1. Buat Google Sheet baru → Extensions > Apps Script → tempel kode dari file Code.gs
//    yang disediakan terpisah → Deploy > New deployment > pilih tipe "Web app" →
//    Execute as: Me, Who has access: Anyone → Deploy → salin URL yang berakhiran /exec.
// 2. Tempel URL itu di bawah ini, di antara tanda kutip.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby4bHS50NhbPVatPye9LOaxjSaHx07YjxNqBkdHBSb5G8PB57l2o07YUcxaIZJJcAU9/exec";
// 3. (Opsional) Kalau di Code.gs Anda mengisi variabel SECRET dengan kode rahasia,
//    isi juga persis sama di sini. Kalau SECRET dikosongkan di Code.gs, biarkan ini "".
const API_TOKEN = "";

/* ---------------- Storage ---------------- */
let persons = {};   // id -> person
let state = { focusId: null, activeSpouseId: null };
let historyStack = [];
// Mode "pilih untuk hapus" pada daftar anak-anak: kalau aktif, kartu anak
// menampilkan kotak centang dan klik kartu tidak lagi berpindah halaman.
let childSelectMode = false;
let selectedChildIds = new Set();

function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

// ---- Catatan teknis ----
// Google Apps Script Web App tidak pernah menyertakan header CORS pada
// responsnya untuk permintaan lintas-domain (fetch), meskipun permintaannya
// sendiri sebenarnya berhasil diproses di server. Karena file ini dibuka dari
// domain lain (GitHub Pages, dsb), fetch() akan selalu diblokir browser.
// Solusinya: BACA data lewat teknik JSONP (tag <script>, tidak kena CORS sama
// sekali), dan SIMPAN data lewat form tersembunyi yang disubmit ke iframe
// tersembunyi (submit form & navigasi iframe juga tidak kena aturan CORS).

// Memuat seluruh data orang dari Google Sheet lewat JSONP.
function loadData(){
  return new Promise((resolve)=>{
    const cbName = '__silsilahCb_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    let resolved = false;   // promise sudah di-resolve (timeout ATAU respons asli)
    let arrived = false;    // respons asli sudah benar-benar datang

    // Hapus tag <script> & fungsi callback dari window — hanya dipanggil
    // setelah respons ASLI datang (bukan saat timeout), supaya kalau
    // responsnya telat, ia tetap bisa diproses dengan benar saat tiba.
    const cleanupReal = ()=>{ delete window[cbName]; if(script.parentNode) script.remove(); };

    window[cbName] = function(json){
      arrived = true;
      if(json && json.error){
        console.error("Gagal memuat dari Google Sheet:", json.error);
        if(!resolved) showToast("Gagal memuat data ("+json.error+").");
        cleanupReal();
        if(!resolved){ resolved = true; resolve(false); }
        return;
      }
      const list = (json && json.persons) || [];
      cleanupReal();
      if(list.length){
        const loaded = {};
        list.forEach(p=>{ loaded[p.id] = p; });
        persons = loaded;
        if(!resolved){ resolved = true; resolve('success'); }
        else{
          // Respons datang setelah sempat "timeout" ditampilkan ke pengguna —
          // tetap terapkan datanya dan render ulang supaya tidak hilang percuma.
          if(typeof render === 'function'){ try{ render(); }catch(e){} }
          showToast("Data berhasil dimuat (agak lambat, tapi berhasil).");
        }
      } else if(!resolved){
        // Respons ASLI dari server bilang memang kosong (bukan gagal/timeout) —
        // ini satu-satunya kondisi yang boleh memicu seed data awal.
        resolved = true;
        resolve('empty');
      }
    };

    const url = SCRIPT_URL + '?action=getAll&callback=' + cbName +
      (API_TOKEN ? ('&token=' + encodeURIComponent(API_TOKEN)) : '');
    const script = document.createElement('script');
    script.src = url;
    script.onerror = function(){
      if(arrived) return; // sudah kepakai sebelumnya, abaikan
      console.error("Gagal memuat dari Google Sheet: script JSONP gagal dimuat.");
      if(!resolved){ showToast("Gagal memuat data. Periksa koneksi internet & URL Apps Script (SCRIPT_URL)."); resolved = true; resolve('error'); }
      cleanupReal();
    };
    document.body.appendChild(script);

    // Kalau lebih dari 40 detik belum ada respons SAMA SEKALI, anggap
    // "belum jelas" untuk sementara (supaya UI tidak menggantung selamanya) —
    // TAPI callback & tag <script>-nya SENGAJA tidak dihapus, supaya kalau
    // ternyata responsnya cuma telat (bukan benar-benar gagal), datanya tetap
    // masuk begitu tiba, alih-alih memicu error di console. Status 'error' di
    // sini TIDAK BOLEH dianggap "kosong" oleh pemanggilnya — supaya data asli
    // tidak pernah ketimpa data contoh (seed) hanya gara-gara koneksi lambat.
    setTimeout(()=>{
      if(!resolved){
        resolved = true;
        showToast("Memuat data lebih lama dari biasanya, mohon tunggu...");
        resolve('error');
      }
    }, 40000);
  });
}

// Mengirim satu paket data (save/delete) lewat form tersembunyi ke iframe
// tersembunyi, supaya tidak lewat fetch() sama sekali (kebal CORS).
function submitViaHiddenForm_(payloadObj){
  return new Promise((resolve)=>{
    const frameName = '__silsilahFrame_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const iframe = document.createElement('iframe');
    iframe.name = frameName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = SCRIPT_URL;
    form.target = frameName;
    form.style.display = 'none';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(payloadObj);
    form.appendChild(input);
    document.body.appendChild(form);

    let done = false;
    const cleanup = ()=>{ setTimeout(()=>{ form.remove(); iframe.remove(); }, 1000); };
    iframe.onload = function(){ if(done) return; done = true; cleanup(); resolve(true); };
    // Jaga-jaga kalau event load tidak terpicu
    setTimeout(()=>{ if(!done){ done = true; cleanup(); resolve(true); } }, 8000);

    form.submit();
  });
}

// Menyimpan data orang (upsert) ke Google Sheet lewat Web App Apps Script.
// PENTING: kalau parameter `ids` diisi, HANYA orang dengan id itu yang dikirim
// ulang — bukan seluruh pohon keluarga. Ini krusial supaya menambah 1
// pasangan/anak tidak ikut mengirim ulang foto semua orang lain (yang bisa
// bikin body request membengkak & lambat begitu pohon keluarga sudah cukup
// besar/berfoto banyak). Kalau `ids` tidak diisi, baru seluruh data dikirim
// (dipakai saat pertama kali seed data / operasi yang menyentuh banyak
// orang sekaligus seperti urutan anak).
async function saveData(ids){
  const targetIds = (ids && ids.length) ? ids : Object.keys(persons);
  try{
    for(let i=0;i<targetIds.length;i+=50){
      const chunk = targetIds.slice(i,i+50).map(id=>persons[id]).filter(Boolean);
      if(!chunk.length) continue;
      await submitViaHiddenForm_({ action:'save', token: API_TOKEN, persons: chunk });
    }
    return true;
  }catch(e){
    console.error("Gagal menyimpan ke Google Sheet:", e);
    showToast("Gagal menyimpan perubahan. Cek koneksi & URL Apps Script (SCRIPT_URL).");
    return false;
  }
}

// Menghapus satu baris orang dari Google Sheet (dipanggil saat "Hapus Orang Ini")
async function deletePersonRemote(id){
  try{
    await submitViaHiddenForm_({ action:'delete', token: API_TOKEN, id });
  }catch(e){ console.error("Gagal menghapus baris:", e); }
}

/* ---------------- Helpers ---------------- */
function getPerson(id){ return id ? persons[id] : null; }
function genderClass(g){ return g==='L'?'male':(g==='P'?'female':'unknown'); }

// Palet warna berbeda untuk tiap generasi, berulang (cycle) kalau generasinya
// banyak. Supaya di pohon keluarga besar, anak dari generasi yang sama
// gampang dikenali tanpa harus baca angka "Gen X" satu-satu.
const GENERATION_PALETTE = [
  '#33587A', // biru navy
  '#8C3A54', // marun
  '#C9A227', // emas tua
  '#3E7A5C', // hijau tua
  '#7A4FA3', // ungu
  '#B5651D', // cokelat oranye
  '#2E7A87', // teal
  '#A3383B', // merah bata
];
function generationColor(gen){
  if(typeof gen !== 'number' || isNaN(gen)) return '#9089A6';
  const idx = ((gen % GENERATION_PALETTE.length) + GENERATION_PALETTE.length) % GENERATION_PALETTE.length;
  return GENERATION_PALETTE[idx];
}
function genBadgeHtml(gen){
  const color = generationColor(gen);
  const label = (typeof gen==='number' && !isNaN(gen)) ? ('Gen '+gen) : 'Gen ?';
  return `<span class="gen-badge" style="background:${color}20;color:${color};box-shadow:inset 0 0 0 1px ${color}55;">${label}</span>`;
}
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function formatDateDisplay(d){
  if(!d) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(d)){
    const [y,m,day] = d.split('-').map(Number);
    const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    return day+' '+months[m-1]+' '+y;
  }
  return d; // data lama yang cuma berisi tahun, tampilkan apa adanya
}
// Menghitung usia dari tanggal/tahun lahir sampai tanggal/tahun acuan
// (tanggal wafat kalau sudah meninggal, atau hari ini kalau masih hidup).
// Mendukung format tahun saja ("1937") maupun tanggal lengkap ("1937-05-12").
// Mengembalikan null kalau datanya tidak cukup untuk dihitung.
function calcAge(birth, untilDate){
  const parse = s=>{
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)){
      const [y,m,d] = s.split('-').map(Number);
      return {y,m,d};
    }
    if(/^\d{4}$/.test(s)) return {y:Number(s), m:null, d:null};
    return null;
  };
  const b = parse(birth);
  if(!b) return null;
  let ref;
  if(untilDate){
    ref = parse(untilDate);
    if(!ref) return null;
  }else{
    const now = new Date();
    ref = {y: now.getFullYear(), m: now.getMonth()+1, d: now.getDate()};
  }
  let age = ref.y - b.y;
  if(b.m && ref.m && (ref.m < b.m || (ref.m===b.m && ref.d < b.d))) age--;
  if(age < 0) return null;
  return age;
}
function yearsLabel(p){
  if(!p) return '';
  const b = formatDateDisplay(p.birthYear);
  const d = formatDateDisplay(p.deathYear);
  let range = '';
  let ageInfo = '';
  if(p.birthYear){
    const age = p.deathYear ? calcAge(p.birthYear, p.deathYear) : calcAge(p.birthYear, null);
    const ageText = (age!==null) ? (age+' th') : '-';
    ageInfo = p.deathYear ? (' (wafat usia '+ageText+')') : (' (usia '+ageText+')');
  }
  if(b && d) range = b+' – '+d+ageInfo;
  else if(b) range = b+' – sekarang'+ageInfo;
  else range = '-';
  if(p.birthPlace && range) return p.birthPlace+' · '+range;
  if(p.birthPlace) return p.birthPlace;
  return range;
}
// Baris keterangan tempat dikuburkan, hanya tampil kalau orang ini sudah
// wafat DAN tempat kuburnya diisi (berguna kalau dikuburkan bukan di
// kampung/tempat asalnya).
function burialInfoLine(p){
  if(!p || !p.deathYear || !p.burialPlace) return '';
  return '⚰ Dikuburkan di '+escapeHtml(p.burialPlace);
}
function avatarHtml(p, size){
  size = size || 38;
  if(p.photo){
    const posY = (typeof p.photoPosY === 'number') ? p.photoPosY : 50;
    return `<img src="${p.photo}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;object-position:center ${posY}%;flex:none;" alt="">`;
  }
  return `<div class="avatar" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.4)}px;">${initials(p.name)}</div>`;
}
// Mengubah file foto menjadi dataURL yang sudah diperkecil, supaya hemat ruang penyimpanan.
// Ukuran gambar & kualitas diturunkan bertahap sampai hasilnya di bawah targetKB,
// supaya foto besar dari HP (bisa 3-10MB) tidak ikut membengkakkan data yang tersimpan.
function resizeImageFile(file, targetKB){
  // Target diturunkan ke 30KB (≈40rb karakter base64) supaya setiap foto tetap
  // muat dalam satu sel Google Sheets, yang punya batas ±50.000 karakter per sel.
  targetKB = targetKB || 30;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const sizes = [240, 180, 130, 90];
        const qualities = [0.7, 0.55, 0.4];
        let result = null;
        outer:
        for(const maxSize of sizes){
          let w = img.width, h = img.height;
          if(w > h){ if(w > maxSize){ h = Math.round(h*maxSize/w); w = maxSize; } }
          else{ if(h > maxSize){ w = Math.round(w*maxSize/h); h = maxSize; } }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          for(const q of qualities){
            const dataUrl = canvas.toDataURL('image/jpeg', q);
            const approxKB = Math.round((dataUrl.length * 0.75) / 1024); // perkiraan ukuran asli dari base64
            result = dataUrl;
            if(approxKB <= targetKB) break outer;
          }
        }
        resolve(result);
      };
      img.onerror = ()=>reject(new Error('Gagal memuat gambar.'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Gagal membaca file.'));
    reader.readAsDataURL(file);
  });
}
// Perkiraan ukuran file dari dataURL, untuk ditampilkan ke pengguna
function dataUrlSizeLabel(dataUrl){
  if(!dataUrl) return '';
  const kb = Math.round((dataUrl.length * 0.75) / 1024);
  return kb < 1024 ? (kb+' KB') : ((kb/1024).toFixed(1)+' MB');
}
function spouses(p){ return (p.spouseIds||[]).map(id=>persons[id]).filter(Boolean); }

// Menghitung generasi ke berapa seseorang, dihitung otomatis dari rantai ayah/ibu
// (bukan disimpan di database — jadi selalu ikut menyesuaikan kalau data pohon berubah).
// Kalau seseorang tidak punya ayah/ibu yang tercatat (misalnya pasangan yang "menikah masuk"
// ke keluarga ini), generasinya mengikuti generasi pasangannya — bukan otomatis dianggap Gen 1.
// Baru kalau benar-benar tidak ada info apa pun (baik dari orang tua maupun pasangan),
// generasi dianggap 1 (generasi awal/leluhur).
function computeGeneration(id, _visited){
  const visited = _visited || new Set();
  if(!id || !persons[id] || visited.has(id)) return null;
  visited.add(id);
  const p = persons[id];
  const genF = p.fatherId ? computeGeneration(p.fatherId, visited) : null;
  const genM = p.motherId ? computeGeneration(p.motherId, visited) : null;
  const known = [genF, genM].filter(g => g !== null);
  if(known.length){
    return Math.max(...known) + 1;
  }
  // Tidak ada jalur orang tua yang diketahui — coba ikuti generasi salah satu pasangan.
  const spouseIds = p.spouseIds || [];
  for(const sid of spouseIds){
    if(visited.has(sid)) continue;
    const g = computeGeneration(sid, visited);
    if(g !== null) return g;
  }
  return 1;
}
// Label ringkas dipakai di kotak pencarian utama & pilihan ayah/ibu/pasangan,
// supaya orang dengan nama sama gampang dibedakan. Formatnya:
// "Nama — Gen X · Lahir 1937 · Tempat Lahir" (bagian lahir/tempat
// otomatis hilang kalau datanya belum diisi).
function personSearchLabel(p){
  if(!p) return '';
  const gen = computeGeneration(p.id);
  const parts = ['Gen '+gen];
  if(p.birthYear) parts.push('Lahir '+formatDateDisplay(p.birthYear));
  if(p.birthPlace) parts.push(p.birthPlace);
  return p.name + ' — ' + parts.join(' · ');
}
// Mencocokkan teks yang diketik di kotak pencarian (Ayah/Ibu/Pasangan) balik ke ID orangnya.
function resolvePersonIdFromLabel(text){
  const val = (text||'').trim();
  if(!val) return null;
  let match = allPersonsList().find(p => personSearchLabel(p)===val);
  if(match) return match.id;
  match = allPersonsList().find(p => p.name.toLowerCase()===val.toLowerCase());
  if(match) return match.id;
  return null;
}
function childrenOfCouple(idA, idB){
  return Object.values(persons).filter(c=>{
    if(idB){
      return (c.fatherId===idA && c.motherId===idB) || (c.fatherId===idB && c.motherId===idA);
    }else{
      return (c.fatherId===idA && !c.motherId) || (c.motherId===idA && !c.fatherId);
    }
  });
}
// Anak dengan urutan manual (order) ditampilkan sesuai urutan itu.
// Yang belum punya urutan manual ditaruh setelahnya, diurutkan dari tahun lahir.
function childComparator(a,b){
  const ao = typeof a.order === 'number', bo = typeof b.order === 'number';
  if(ao && bo) return a.order - b.order;
  if(ao && !bo) return -1;
  if(!ao && bo) return 1;
  return (a.birthYear||'9999').localeCompare(b.birthYear||'9999');
}
// Menukar urutan dua anak yang bersebelahan, lalu menormalkan urutan seluruh saudara kandung
async function reorderChild(kids, index, direction){
  const swapWith = index + direction;
  if(swapWith < 0 || swapWith >= kids.length) return;
  kids.forEach((k, i)=>{ persons[k.id].order = i; });
  const idA = kids[index].id, idB = kids[swapWith].id;
  const tmp = persons[idA].order;
  persons[idA].order = persons[idB].order;
  persons[idB].order = tmp;
  // Tampilkan perubahan urutan di layar SEKARANG JUGA, jangan menunggu
  // simpan ke server selesai dulu — supaya klik ▲▼ selalu terasa langsung
  // berubah, tidak seperti "diam" saat koneksi lambat.
  render();
  const ok = await saveData(kids.map(k=>k.id));
  if(!ok){ showToast('Urutan berubah di layar, tapi gagal tersimpan ke server. Coba klik sekali lagi atau periksa koneksi.'); }
}
function allPersonsList(){
  return Object.values(persons).sort((a,b)=>a.name.localeCompare(b.name));
}

  childSelectMode = false; selectedChildIds.clear();

}

  // --- children row ---

  const kidsGrid = document.createElement('div'); kidsGrid.className='children-grid';

    bulkAddTile.onclick=()=>openBulkAddChildrenModal(

function toggleChildSelected(id){
  if(selectedChildIds.has(id)) selectedChildIds.delete(id);
  else selectedChildIds.add(id);
}

// Menghapus beberapa anak sekaligus yang sudah dicentang. Pasangan dan
// anak-anak dari orang yang dihapus (kalau ada) tetap tersimpan, hanya
// tautannya ke orang yang dihapus yang dilepas — sama seperti hapus satu
// orang lewat tombol "Sunting" > "Hapus".
async function bulkDeleteSelectedChildren(){
  const ids = Array.from(selectedChildIds);
  if(ids.length===0) return;
  const names = ids.map(id=>persons[id]?persons[id].name:'').filter(Boolean).join(', ');
  if(!confirm('Hapus '+ids.length+' anak berikut dari pohon keluarga: '+names+'? Tindakan ini tidak bisa dibatalkan.')) return;

  const affected = new Set();
  ids.forEach(deletedId=>{
    const p = persons[deletedId];
    if(!p) return;
    (p.spouseIds||[]).forEach(sid=>{
      if(persons[sid]){ persons[sid].spouseIds = (persons[sid].spouseIds||[]).filter(x=>x!==deletedId); affected.add(sid); }
    });
    Object.values(persons).forEach(c=>{
      if(c.fatherId===deletedId){ c.fatherId=null; affected.add(c.id); }
      if(c.motherId===deletedId){ c.motherId=null; affected.add(c.id); }
    });
    delete persons[deletedId];
  });

  historyStack = historyStack.filter(id=>persons[id] && !ids.includes(id));
  if(ids.includes(state.activeSpouseId)){
    state.activeSpouseId = (persons[state.focusId] && (persons[state.focusId].spouseIds||[])[0]) || null;
  }
  childSelectMode = false;
  selectedChildIds.clear();

  // Perbarui tampilan LANGSUNG — jangan menunggu proses simpan ke server
  // selesai dulu, supaya tidak terasa "diam"/perlu di-refresh manual.
  render();
  showToast(ids.length+' anak berhasil dihapus.');

  // Kirim perubahan ke Google Sheet di belakang layar, tidak menahan tampilan.
  try{
    await Promise.all(ids.map(id=>deletePersonRemote(id)));
    await saveData(Array.from(affected));
  }catch(e){
    console.error("Gagal sinkron hapus ke server:", e);
    showToast('Terhapus di layar, tapi gagal sinkron ke server. Coba refresh untuk memastikan.');
  }
}

function parentOrEmptySlot(focus, which){

    return personCard(p, false, true);

  const btn = document.createElement('button');
  btn.textContent = which==='father' ? '+ Tambah Ayah' : '+ Tambah Ibu';
  btn.onclick = ()=>openAddModal({mode:'parent', childId:focus.id, gender: which==='father'?'L':'P'});
  slot.appendChild(btn);
  return slot;
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

let modalCtx = null;

function isValidDateOrYear(s){
  if(!s) return true;
  return /^\d{4}$/.test(s) || /^\d{4}-\d{2}-\d{2}$/.test(s);
}

function openAddModal(ctx){
  modalCtx = ctx;

  let pendingPhoto = null;

    // `applyState` dipanggil HANYA setelah data berhasil tersimpan ke server,
    // supaya tampilan (fokus/pasangan aktif yang "ke-load") tidak pernah
    // mendahului data yang sesungguhnya tersimpan. `undo` membatalkan semua
    // perubahan lokal kalau simpan ke server gagal, supaya layar tidak
    // menampilkan pasangan/anak yang sebenarnya belum tersimpan.
    let applyState = ()=>{};
    let undo = ()=>{ delete persons[newId]; };
    // `saveIds`: hanya orang-orang ini yang benar-benar dikirim ke Google Sheet
    // saat "Simpan" ditekan (bukan seluruh pohon keluarga) — lihat catatan di saveData().
    let saveIds = [newId];

    if(ctx.mode==='parent'){
      newPerson.gender = ctx.gender;

      if(otherId && persons[otherId]){
        newPerson.spouseIds.push(otherId);
        persons[otherId].spouseIds = Array.from(new Set([...(persons[otherId].spouseIds||[]), newId]));
        saveIds.push(otherId);
      }
      persons[newId] = newPerson;
      saveIds.push(ctx.childId);
      undo = ()=>{
        if(ctx.gender==='L') child.fatherId = prevParentId; else child.motherId = prevParentId;
        if(otherId && persons[otherId]) persons[otherId].spouseIds = (persons[otherId].spouseIds||[]).filter(x=>x!==newId);
        delete persons[newId];
      };
      applyState = ()=>{ state.focusId = ctx.childId ? ctx.childId : state.focusId; };
    }
    else if(ctx.mode==='spouse'){
      const dupeSp = findDuplicateSpouse(ctx.personId, name);
      if(dupeSp && !confirm('Nama "'+name+'" sudah tercatat sebagai pasangan dari '+persons[ctx.personId].name+'. Tetap simpan sebagai pasangan baru?')){
        return;
      }
      persons[newId] = newPerson;
      const partner = persons[ctx.personId];
      partner.spouseIds = Array.from(new Set([...(partner.spouseIds||[]), newId]));
      newPerson.spouseIds = [ctx.personId];
      saveIds.push(ctx.personId);
      undo = ()=>{
        partner.spouseIds = (partner.spouseIds||[]).filter(x=>x!==newId);
        delete persons[newId];
      };
      applyState = ()=>{ state.activeSpouseId = newId; };
    }
    else if(ctx.mode==='child'){
      const dupeC = findDuplicateChild(ctx.fatherId||null, ctx.motherId||null, name);
      if(dupeC && !confirm('Nama "'+name+'" sudah ada sebagai anak di sini. Tetap simpan sebagai anak baru (data terpisah)?')){
        return;
      }
      newPerson.fatherId = ctx.fatherId || null;
      newPerson.motherId = ctx.motherId || null;
      newPerson.order = nextChildOrder(ctx.fatherId||null, ctx.motherId||null);
      persons[newId] = newPerson;
      // mode 'child': posisi/fokus TIDAK diubah — tetap di posisi semula
      // (sama seperti pola "Tambah Banyak") supaya setelah simpan langsung
      // menampilkan data yang sudah ada, tidak meloncat ke kartu ayah/ibu.
    }
    else if(ctx.mode==='global'){
      if(globalRel==='child'){
        const fRaw = document.getElementById('selFather').value;
        const mRaw = document.getElementById('selMother').value;
        const fId = resolvePersonIdFromLabel(fRaw);
        const mId = resolvePersonIdFromLabel(mRaw);
        if(fRaw.trim() && !fId){ showToast('Nama ayah tidak ditemukan di daftar. Pilih dari saran yang muncul.'); return; }
        if(mRaw.trim() && !mId){ showToast('Nama ibu tidak ditemukan di daftar. Pilih dari saran yang muncul.'); return; }
        if(!fId && !mId){ showToast('Pilih minimal salah satu orang tua.'); return; }
        const dupeGC = findDuplicateChild(fId||null, mId||null, name);
        if(dupeGC && !confirm('Nama "'+name+'" sudah ada sebagai anak dari orang tua yang sama. Tetap simpan sebagai anak baru (data terpisah)?')){
          return;
        }
        newPerson.fatherId = fId; newPerson.motherId = mId;
        newPerson.order = nextChildOrder(fId||null, mId||null);
        persons[newId] = newPerson;
        applyState = ()=>{
          state.focusId = fId || mId;
          state.activeSpouseId = (fId && mId) ? (fId===state.focusId?mId:fId) : null;
        };
      }else{
        const spRaw = document.getElementById('selSpouse').value;
        const spId = resolvePersonIdFromLabel(spRaw);
        if(!spId){ showToast('Pilih pasangan dari saran yang muncul.'); return; }
        persons[newId] = newPerson;
        persons[spId].spouseIds = Array.from(new Set([...(persons[spId].spouseIds||[]), newId]));
        newPerson.spouseIds = [spId];
        saveIds.push(spId);
        undo = ()=>{
          persons[spId].spouseIds = (persons[spId].spouseIds||[]).filter(x=>x!==newId);
          delete persons[newId];
        };
        applyState = ()=>{ state.focusId = spId; state.activeSpouseId = newId; };
      }
    }

    // Kunci tombol Simpan selagi menunggu server, supaya tidak diklik dobel
    // dan supaya pengguna tahu prosesnya belum selesai (bukan macet diam-diam).
    const saveBtnEl = document.getElementById('saveBtn');
    const originalLabel = saveBtnEl.textContent;
    saveBtnEl.disabled = true;
    saveBtnEl.textContent = 'Menyimpan...';

    // Hanya mengirim dokumen yang benar-benar berubah (orang baru + orang tua/
    // pasangan yang tertaut), BUKAN seluruh pohon keluarga — lihat saveData().
    const ok = await saveData(saveIds);

    if(!ok){
      // Simpan ke server GAGAL: batalkan perubahan lokal supaya tampilan
      // tidak "berpura-pura" pasangan/anak sudah ada padahal belum tersimpan.
      // Ini yang sebelumnya bikin pasangan/anak baru terlihat sudah masuk di
      // layar tapi hilang lagi begitu data dimuat ulang dari server.
      undo();
      saveBtnEl.disabled = false;
      saveBtnEl.textContent = originalLabel;
      return;
    }

    applyState();
    closeModal();
    render();
    showToast('Berhasil ditambahkan ke pohon keluarga.');
  };
}

// ---- Integrasi tombol "Kembali" HP dengan modal ----
// Setiap kali modal (id="modalOverlay") dibuka, kita "dorong" satu entri
// history palsu. Kalau pengguna menekan tombol kembali di HP, browser akan
// memicu event popstate SEBELUM benar-benar keluar dari halaman/app; di
// situ kita tangkap dan cukup tutup modalnya, bukan keluar dari aplikasi.
// Kalau modal ditutup lewat cara biasa (tombol Tutup/Batal, klik di luar
// modal), kita "konsumsi" entri history palsu itu lewat history.back()
// supaya tombol kembali fisik tidak jadi harus ditekan dua kali nanti.
let modalHistoryPushed = false;
new MutationObserver(mutations=>{
  mutations.forEach(m=>{
    m.addedNodes.forEach(node=>{
      if(node.nodeType===1 && node.id==='modalOverlay' && !modalHistoryPushed){
        modalHistoryPushed = true;
        history.pushState({ftModal:true}, '');
      }
    });
  });
}).observe(document.body, {childList:true});

window.addEventListener('popstate', ()=>{
  const ov = document.getElementById('modalOverlay');
  if(ov){ ov.remove(); }
  modalHistoryPushed = false;
});

function closeModal(){
  const ov = document.getElementById('modalOverlay');
  if(ov) ov.remove();
  if(modalHistoryPushed){
    modalHistoryPushed = false;
    history.back();
  }
}

/* ---------------- Ulang Tahun Hari Ini ---------------- */
// Hanya orang yang tanggal lahirnya lengkap (YYYY-MM-DD) yang bisa dicek,
// karena data lama yang cuma berisi tahun (mis. "1937") tidak diketahui
// bulan & tanggalnya sehingga tidak mungkin dipastikan ulang tahunnya hari ini.
function birthdayPeopleToday(){
  const now = new Date();
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  const todaySuffix = '-'+mm+'-'+dd;
  return Object.values(persons)
    .filter(p=> typeof p.birthYear==='string' && /^\d{4}-\d{2}-\d{2}$/.test(p.birthYear) && p.birthYear.slice(4)===todaySuffix)
    .sort((a,b)=>a.name.localeCompare(b.name));
}

function openBirthdayModal(){
  const list = birthdayPeopleToday();
  const overlay = document.createElement('div'); overlay.className='overlay'; overlay.id='modalOverlay';

  const itemsHtml = list.length ? list.map((p,i)=>`
    <div class="birthday-item" data-id="${p.id}" style="display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:10px;cursor:pointer;">
      <span style="width:24px;text-align:right;font-weight:600;color:var(--ink-soft);flex:none;">${i+1}.</span>
      ${avatarHtml(p,44)}
      <span style="font-weight:600;color:var(--ink);">${escapeHtml(p.name)}</span>
    </div>`).join('') : `<p class="hint">Tidak ada anggota keluarga yang berulang tahun hari ini (yang tanggal lahirnya lengkap tercatat).</p>`;

  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>🎂 Ulang Tahun Hari Ini</h3><p>${formatTodayLong(new Date())}</p></div>
      <div class="modal-body" style="max-height:420px;overflow:auto;">${itemsHtml}</div>
      <div class="modal-foot">
        <button class="btn btn-outline" id="cancelBtn">Tutup</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('cancelBtn').onclick = closeModal;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  overlay.querySelectorAll('.birthday-item').forEach(el=>{
    el.onmouseenter = ()=>{ el.style.background='var(--paper-dark)'; };
    el.onmouseleave = ()=>{ el.style.background='transparent'; };
    el.onclick = ()=>{ closeModal(); navigate(el.getAttribute('data-id')); };
  });
}
function formatTodayLong(d){
  const days=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  return days[d.getDay()]+', '+d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
}

/* ---------------- Dashboard Kelengkapan Data per Cabang (Gen 2) ---------------- */
// "Cabang" = anak kandung (bukan pasangan yang menikah masuk) dari leluhur Gen 1
// (pasangan paling atas di pohon keluarga, mis. KH Yasin & istrinya). Dideteksi
// otomatis lewat computeGeneration, BUKAN hardcode ID, supaya tetap akurat kalau
// data berubah (nama leluhur diedit, dsb).
function findGen2Branches(){
  return Object.values(persons).filter(p=>{
    if(!p.fatherId || !p.motherId) return false;
    return computeGeneration(p.fatherId)===1 && computeGeneration(p.motherId)===1;
  }).sort(childComparator);
}

// Mengumpulkan seluruh anggota satu cabang: orang itu sendiri, seluruh
// keturunan darahnya (anak, cucu, dst — tanpa batas kedalaman), DAN
// pasangan-pasangan yang menikah masuk ke cabang tsb (karena datanya juga
// bagian dari catatan cabang ini). Pakai BFS + Set supaya tidak dobel/infinite.
function collectBranchMembers(rootId){
  const visited = new Set();
  const queue = [rootId];
  while(queue.length){
    const id = queue.shift();
    if(visited.has(id) || !persons[id]) continue;
    visited.add(id);
    const p = persons[id];
    (p.spouseIds||[]).forEach(sid=>{ if(!visited.has(sid)) queue.push(sid); });
    Object.values(persons).forEach(c=>{
      if((c.fatherId===id || c.motherId===id) && !visited.has(c.id)) queue.push(c.id);
    });
  }
  return Array.from(visited).map(id=>persons[id]).filter(Boolean);
}

// Kelengkapan data satu orang. Field inti (dipakai untuk skor keseluruhan):
// foto, tanggal lahir LENGKAP (bukan cuma tahun), dan tempat lahir.
// Info wafat (tanggal wafat lengkap + tempat kubur) dihitung terpisah,
// karena field ini cuma relevan untuk orang yang memang sudah tercatat wafat.
function personCompleteness(p){
  const core = {
    foto: !!p.photo,
    tanggalLahirLengkap: /^\d{4}-\d{2}-\d{2}$/.test(p.birthYear||''),
    tempatLahir: !!(p.birthPlace && p.birthPlace.trim()),
  };
  const coreVals = Object.values(core);
  const score = coreVals.filter(Boolean).length / coreVals.length;
  const isWafat = !!(p.deathYear && String(p.deathYear).trim());
  const wafatLengkap = isWafat ? (/^\d{4}-\d{2}-\d{2}$/.test(p.deathYear) && !!(p.burialPlace && p.burialPlace.trim())) : null;
  return {core, score, isWafat, wafatLengkap};
}

function branchStats(members){
  let sumFoto=0,sumTgl=0,sumTempat=0, wafatCount=0, wafatLengkapCount=0, sumScore=0;
  members.forEach(p=>{
    const r = personCompleteness(p);
    if(r.core.foto) sumFoto++;
    if(r.core.tanggalLahirLengkap) sumTgl++;
    if(r.core.tempatLahir) sumTempat++;
    if(r.isWafat){ wafatCount++; if(r.wafatLengkap) wafatLengkapCount++; }
    sumScore += r.score;
  });
  const n = members.length || 1;
  return {
    total: members.length,
    fotoPct: Math.round(100*sumFoto/n),
    tglPct: Math.round(100*sumTgl/n),
    tempatPct: Math.round(100*sumTempat/n),
    wafatCount, wafatLengkapCount,
    wafatPct: wafatCount ? Math.round(100*wafatLengkapCount/wafatCount) : null,
    overallPct: Math.round(100*sumScore/n)
  };
}

function barColor(pct){
  if(pct>=80) return '#3F7D52';   // hijau — lengkap
  if(pct>=50) return 'var(--gold)'; // kuning emas — sedang
  return 'var(--female)';         // merah muda tua — masih kurang
}

function metricBarHtml(label, pct){
  const color = barColor(pct);
  return `
    <div style="margin-bottom:7px;">
      <div class="branch-metric-label"><span>${label}</span><span style="font-weight:700;color:${color};">${pct}%</span></div>
      <div class="branch-bar-track"><div class="branch-bar-fill" style="width:${pct}%;background:${color};"></div></div>
    </div>`;
}

function maxGeneration(){
  let max=1;
  Object.keys(persons).forEach(id=>{
    const g = computeGeneration(id);
    if(g>max) max = g;
  });
  return max;
}

// Mengelompokkan anggota satu cabang menurut generasinya masing-masing
// (Gen 2 = orang itu sendiri, Gen 3 = anak-anaknya, Gen 4 = cucu, dst),
// lalu menghitung skor kelengkapan per generasi tsb.
function computeBranchGenerationRows(root){
  const members = collectBranchMembers(root.id);
  const byGen = {};
  members.forEach(m=>{
    const g = computeGeneration(m.id);
    if(!byGen[g]) byGen[g] = [];
    byGen[g].push(m);
  });
  return Object.keys(byGen).map(Number).sort((a,b)=>a-b)
    .map(g=>({ gen:g, members: byGen[g].sort(childComparator), stats: branchStats(byGen[g]) }));
}

// Daftar ringkas per orang dalam satu generasi: foto+nama, dan tanda data
// apa saja yang masih kurang (biar langsung tahu siapa yang perlu dilengkapi).
function memberListHtml(members){
  return members.map(m=>{
    const r = personCompleteness(m);
    const missing = [];
    if(!r.core.foto) missing.push('foto');
    if(!r.core.tanggalLahirLengkap) missing.push('tgl lahir');
    if(!r.core.tempatLahir) missing.push('tempat lahir');
    if(r.isWafat && !r.wafatLengkap) missing.push('info wafat');
    const statusHtml = missing.length
      ? `<span style="font-size:11px;color:var(--female);flex:none;white-space:nowrap;">${missing.join(', ')}</span>`
      : `<span style="font-size:11px;color:#3F7D52;flex:none;">Lengkap ✅</span>`;
    return `
      <div class="member-row" data-id="${m.id}" style="display:flex;align-items:center;gap:8px;padding:6px 2px;border-top:1px solid #EFEAD9;cursor:pointer;">
        ${avatarHtml(m,28)}
        <span style="flex:1;min-width:0;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(m.name)}</span>
        ${statusHtml}
      </div>`;
  }).join('');
}

function metricCardHtml({headerHtml, stats, clickId}){
  const color = barColor(stats.overallPct);
  return `
    <div class="branch-card"${clickId?` data-id="${clickId}"`:''}>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
        ${headerHtml}
        <div style="text-align:center;flex:none;">
          <div style="font-size:20px;font-weight:800;color:${color};">${stats.overallPct}%</div>
          <div style="font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;">Skor</div>
        </div>
      </div>
      ${metricBarHtml('Foto tersedia', stats.fotoPct)}
      ${metricBarHtml('Tanggal lahir lengkap', stats.tglPct)}
      ${metricBarHtml('Tempat lahir terisi', stats.tempatPct)}
      ${stats.wafatCount ? metricBarHtml('Info wafat lengkap ('+stats.wafatCount+' orang wafat)', stats.wafatPct) : '<div class="hint">Belum ada anggota yang tercatat wafat di sini.</div>'}
    </div>`;
}

// Tab "Semua Cabang": satu kartu per cabang (ringkasan lintas generasi).
function overviewCardsHtml(branches){
  const rows = branches.map(root=>{
    const stats = branchStats(collectBranchMembers(root.id));
    return {root, stats};
  }).sort((a,b)=> b.stats.overallPct - a.stats.overallPct);

  return rows.map((r,i)=>{
    const {root, stats} = r;
    const headerHtml = `
      <span style="width:22px;text-align:right;font-weight:700;color:var(--ink-soft);flex:none;">${i+1}.</span>
      ${avatarHtml(root,40)}
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(root.name)}</div>
        <div style="font-size:11.5px;color:var(--ink-soft);">${stats.total} anggota (seluruh cabang, semua generasi)</div>
      </div>`;
    return metricCardHtml({headerHtml, stats, clickId:root.id});
  }).join('');
}

// Tab satu cabang tertentu: satu kartu per generasi DI DALAM cabang itu
// (Gen 2 = dia sendiri, Gen 3 = anak-anaknya, Gen 4 = cucu, dst).
function branchDetailCardsHtml(root){
  const genRows = computeBranchGenerationRows(root);
  if(!genRows.length) return `<p class="hint">Belum ada anggota tercatat di cabang ini.</p>`;
  return genRows.map(({gen, members, stats}, idx)=>{
    const isRootGen = gen===computeGeneration(root.id);
    const color = barColor(stats.overallPct);
    return `
    <details class="branch-card gen-details"${idx===0?' open':''}>
      <summary>
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;background:linear-gradient(135deg, var(--pine), var(--pine-dark));color:#F3EFE3;">G${gen}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;color:var(--ink);">Generasi ${gen}${isRootGen ? ' (dirinya sendiri)' : ''}</div>
            <div style="font-size:11.5px;color:var(--ink-soft);">${stats.total} anggota di generasi ini</div>
          </div>
          <div style="font-size:17px;font-weight:800;color:${color};flex:none;">${stats.overallPct}%</div>
        </div>
      </summary>
      <div style="margin-top:12px;">
        ${metricBarHtml('Foto tersedia', stats.fotoPct)}
        ${metricBarHtml('Tanggal lahir lengkap', stats.tglPct)}
        ${metricBarHtml('Tempat lahir terisi', stats.tempatPct)}
        ${stats.wafatCount ? metricBarHtml('Info wafat lengkap ('+stats.wafatCount+' orang wafat)', stats.wafatPct) : '<div class="hint">Belum ada anggota yang tercatat wafat di sini.</div>'}
      </div>
      <div style="margin-top:12px;">
        <div style="font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;">Daftar anggota (klik untuk buka & lengkapi)</div>
        ${memberListHtml(members)}
      </div>
    </details>`;
  }).join('');
}

/* ---------------- Bulk Add Children Modal ---------------- */
// Menambahkan banyak anak sekaligus dari daftar nama yang ditempel/ditulis,
// satu nama per baris. Opsional tambahkan koma lalu L/P untuk jenis kelamin,
// misalnya: "Dananhuri, L"
//
// Alur baru:
// 1) Pengguna tempel/tulis daftar nama, lalu klik "Periksa Daftar".
// 2) Nama yang dobel (baik dobel di dalam daftar yang sama, maupun dengan anak
//    yang sudah ada dari orang tua yang sama) otomatis ditandai & dicentang
//    sebagai "akan dilewati". Pengguna bisa mencentang/hapus centang bebas
//    untuk mengubah mana yang benar-benar mau dilewati/dihapus dari daftar.
// 3) Klik "Simpan" untuk menambahkan hanya baris yang TIDAK dicentang.
function normalizeNameForCompare(s){
  return (s||'').trim().toLowerCase().replace(/\s+/g,' ');
}

// Cek apakah sudah ada anak dengan nama yang sama (diabaikan besar/kecil huruf
// dan spasi berlebih) dari pasangan orang tua yang sama persis.
function findDuplicateChild(fatherId, motherId, name){
  const norm = normalizeNameForCompare(name);
  if(!norm) return null;
  return Object.values(persons).find(c=>{
    if(normalizeNameForCompare(c.name)!==norm) return false;
    if(fatherId && motherId) return c.fatherId===fatherId && c.motherId===motherId;
    if(fatherId) return c.fatherId===fatherId && !c.motherId;
    if(motherId) return c.motherId===motherId && !c.fatherId;
    return false;
  }) || null;
}

// Cek apakah orang ini sudah punya pasangan dengan nama yang sama.
function findDuplicateSpouse(personId, name){
  const norm = normalizeNameForCompare(name);
  if(!norm) return null;
  const person = persons[personId];
  if(!person) return null;
  return (person.spouseIds||[]).map(id=>persons[id]).filter(Boolean)
    .find(sp=>normalizeNameForCompare(sp.name)===norm) || null;
}

// Menentukan nomor urutan (order) untuk anak baru dari pasangan orang tua
// tertentu, supaya anak yang ditambahkan satu-satu ikut punya urutan yang
// jelas (ditaruh paling belakang), bukan dibiarkan tanpa urutan.
function nextChildOrder(fatherId, motherId){
  const siblings = Object.values(persons).filter(c=>{
    if(fatherId && motherId) return c.fatherId===fatherId && c.motherId===motherId;
    if(fatherId) return c.fatherId===fatherId && !c.motherId;
    if(motherId) return c.motherId===motherId && !c.fatherId;
    return false;
  });
  let maxOrder = -1;
  siblings.forEach(k=>{ if(typeof k.order==='number' && k.order>maxOrder) maxOrder = k.order; });
  return maxOrder + 1;
}

function openBulkAddChildrenModal(fatherId, motherId){
  const father = getPerson(fatherId), mother = getPerson(motherId);
  const parentNames = [father, mother].filter(Boolean).map(p=>p.name).join(' & ') || 'orang tua ini';
  const overlay = document.createElement('div'); overlay.className='overlay'; overlay.id='modalOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-head"><h3>Tambah Banyak Anak</h3><p>Anak dari ${escapeHtml(parentNames)}. Satu nama per baris.</p></div>
      <div class="modal-body">
        <div class="field" id="bulkStep1">
          <label>Daftar Nama</label>
          <textarea id="bulkNames" rows="8" style="width:100%;padding:11px 13px;border-radius:10px;border:1px solid #d8d0ba;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);resize:vertical;" placeholder="Dananhuri
M. Munjid, L
M. Fakih, L
M. Shonhaji, L"></textarea>
          <div class="hint" style="margin-top:6px;">Satu nama per baris. Opsional: tambahkan koma lalu L atau P untuk jenis kelamin, contoh "Ulyanah, P". Urutan baris = urutan anak (bisa diubah lagi nanti pakai ▲▼).</div>
        </div>
        <div id="bulkStep2" style="display:none;">
          <div class="hint" id="bulkDupeSummary" style="margin-bottom:10px;"></div>
          <div id="bulkPreviewList" style="display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;"></div>
          <div class="hint" style="margin-top:10px;">Centang = <strong>tidak</strong> akan disimpan (dilewati/dihapus dari daftar). Baris yang dobel sudah otomatis dicentang, silakan sesuaikan bila perlu.</div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-outline" id="cancelBtn">Batal</button>
        <button class="btn btn-outline" id="bulkBackBtn" style="display:none;">Kembali</button>
        <button class="btn btn-primary" id="bulkCheckBtn">Periksa Daftar</button>
        <button class="btn btn-primary" id="bulkSaveBtn" style="display:none;">Simpan</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById('cancelBtn').onclick = closeModal;
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  document.getElementById('bulkNames').focus();

  // Anak yang sudah ada dari pasangan orang tua ini, untuk deteksi dobel lintas data lama.
  const existingKids = childrenOfCouple(fatherId, motherId);
  const existingNamesNormalized = existingKids.map(k=>normalizeNameForCompare(k.name));

  let parsedEntries = []; // {name, gender, isDupe, dupeReason}

  function parseLines(){
    const raw = document.getElementById('bulkNames').value;
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    const seenInBatch = {}; // normalizedName -> count so far
    return lines.map(line=>{
      const parts = line.split(',');
      const name = parts[0].trim();
      let gender = '';
      if(parts[1]){
        const g = parts[1].trim().toUpperCase();
        if(g==='L' || g==='P') gender = g;
      }
      const norm = normalizeNameForCompare(name);
      let dupeReason = null;
      if(norm){
        if(seenInBatch[norm]){
          dupeReason = 'dobel di daftar ini';
        } else if(existingNamesNormalized.includes(norm)){
          dupeReason = 'sudah ada di data anak';
        }
        seenInBatch[norm] = (seenInBatch[norm]||0) + 1;
      }
      return { name, gender, isDupe: !!dupeReason, dupeReason };
    }).filter(e=>e.name);
  }

  function renderPreview(){
    const listEl = document.getElementById('bulkPreviewList');
    const dupeCount = parsedEntries.filter(e=>e.isDupe).length;
    document.getElementById('bulkDupeSummary').innerHTML = dupeCount>0
      ? `⚠️ Ditemukan <strong>${dupeCount}</strong> nama yang kemungkinan dobel. Baris tersebut sudah dicentang agar dilewati.`
      : `Tidak ada nama dobel yang terdeteksi. Silakan periksa sekali lagi lalu klik Simpan.`;
    listEl.innerHTML = parsedEntries.map((e,i)=>`
      <label style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid ${e.isDupe?'#e0b4b8':'#e4ded0'};background:${e.isDupe?'var(--female-soft)':'#fff'};cursor:pointer;">
        <input type="checkbox" data-idx="${i}" class="bulkSkipChk" ${e.isDupe?'checked':''} style="width:16px;height:16px;flex:0 0 auto;">
        <span style="flex:1;">
          <span style="font-weight:600;">${escapeHtml(e.name)}</span>
          ${e.gender?` <span class="hint">(${e.gender})</span>`:''}
          ${e.isDupe?` <span style="color:var(--female);font-size:12px;font-weight:600;">— ${escapeHtml(e.dupeReason)}</span>`:''}
        </span>
      </label>`).join('');
  }

  document.getElementById('bulkCheckBtn').onclick = ()=>{
    parsedEntries = parseLines();
    if(parsedEntries.length===0){ showToast('Isi minimal satu nama.'); return; }
    renderPreview();
    document.getElementById('bulkStep1').style.display='none';
    document.getElementById('bulkStep2').style.display='block';
    document.getElementById('bulkCheckBtn').style.display='none';
    document.getElementById('bulkSaveBtn').style.display='inline-block';
    document.getElementById('bulkBackBtn').style.display='inline-block';
  };

  document.getElementById('bulkBackBtn').onclick = ()=>{
    document.getElementById('bulkStep1').style.display='block';
    document.getElementById('bulkStep2').style.display='none';
    document.getElementById('bulkCheckBtn').style.display='inline-block';
    document.getElementById('bulkSaveBtn').style.display='none';
    document.getElementById('bulkBackBtn').style.display='none';
  };

  document.getElementById('bulkSaveBtn').onclick = async ()=>{
    // Baca ulang status centang (bisa sudah diubah manual oleh pengguna)
    document.querySelectorAll('.bulkSkipChk').forEach(chk=>{
      const idx = parseInt(chk.getAttribute('data-idx'),10);
      if(parsedEntries[idx]) parsedEntries[idx].skip = chk.checked;
    });
    const toAdd = parsedEntries.filter(e=>!e.skip);
    if(toAdd.length===0){ showToast('Tidak ada nama yang akan disimpan (semua dicentang/dilewati).'); return; }

    // normalkan urutan anak yang sudah ada (sesuai urutan tampil saat ini),
    // baru tambahkan anak baru setelahnya, supaya anak lama tidak tersalip
    existingKids.sort(childComparator);
    existingKids.forEach((k,i)=>{ persons[k.id].order = i; });
    let nextOrder = existingKids.length;

    const addedIds = [];
    toAdd.forEach(entry=>{
      const newId = uid();
      persons[newId] = { id:newId, name:entry.name, gender:entry.gender, birthYear:'', deathYear:'', photo:null, fatherId: fatherId||null, motherId: motherId||null, spouseIds:[], order: nextOrder };
      addedIds.push(newId);
      nextOrder++;
    });

    const bulkSaveBtnEl = document.getElementById('bulkSaveBtn');
    const originalBulkLabel = bulkSaveBtnEl.textContent;
    bulkSaveBtnEl.disabled = true;
    bulkSaveBtnEl.textContent = 'Menyimpan...';

    // Hanya kirim anak-anak baru + anak lama yang order-nya ikut dinormalkan,
    // bukan seluruh pohon keluarga.
    const saveIds = existingKids.map(k=>k.id).concat(addedIds);
    const ok = await saveData(saveIds);

    if(!ok){
      // Gagal tersimpan ke server: batalkan penambahan lokal supaya daftar
      // anak tidak terlihat sudah bertambah padahal sebenarnya belum tersimpan.
      addedIds.forEach(id=>delete persons[id]);
      bulkSaveBtnEl.disabled = false;
      bulkSaveBtnEl.textContent = originalBulkLabel;
      showToast('Gagal menyimpan ke server (periksa koneksi/URL Apps Script). Data belum tersimpan — silakan coba lagi.');
      return;
    }

    closeModal();
    render();
    const skippedCount = parsedEntries.length - toAdd.length;
    showToast(toAdd.length+' anak berhasil ditambahkan.' + (skippedCount>0 ? (' ('+skippedCount+' dilewati karena dobel)') : ''));
  };
}

  let ePhotoPosY = (typeof p.photoPosY === 'number') ? p.photoPosY : 50;
  function renderEPhotoPreview(){
    const src = eNewPhoto || p.photo;
    const preview = document.getElementById('ePhotoPreview');
    const posWrap = document.getElementById('ePhotoPosWrap');
    if(src){
      preview.innerHTML = `<img src="${src}" style="width:70px;height:70px;border-radius:50%;object-fit:cover;object-position:center ${ePhotoPosY}%;">`+(eNewPhoto?` <span class="hint">${dataUrlSizeLabel(eNewPhoto)}</span>`:'');
      if(posWrap) posWrap.style.display='block';
    }else{
      preview.innerHTML = '<span class="hint">Belum ada foto.</span>';
      if(posWrap) posWrap.style.display='none';
    }
  }
  const ePhotoInput = document.getElementById('ePhotoInput');
  ePhotoInput.onchange = async ()=>{
    const file = ePhotoInput.files && ePhotoInput.files[0];
    if(!file) return;
    try{
      document.getElementById('ePhotoPreview').innerHTML = '<span class="hint">Mengompres foto...</span>';
      eNewPhoto = await resizeImageFile(file);
      ePhotoPosY = 50;
      const posSlider = document.getElementById('ePhotoPos');
      if(posSlider) posSlider.value = 50;
      renderEPhotoPreview();
      const removeCb = document.getElementById('eRemovePhoto');
      if(removeCb) removeCb.checked = false;
    }catch(e){ showToast('Gagal memuat foto.'); }
  };
  const ePosSlider = document.getElementById('ePhotoPos');
  if(ePosSlider){
    ePosSlider.oninput = ()=>{ ePhotoPosY = parseInt(ePosSlider.value,10); renderEPhotoPreview(); };
  }

  document.getElementById('saveEditBtn').onclick = async ()=>{
    const name = document.getElementById('eName').value.trim();
    if(!name){ showToast('Nama wajib diisi.'); return; }
    const newBirth = document.getElementById('eBirth').value.trim();
    const newDeath = document.getElementById('eDeath').value.trim();
    if(!isValidDateOrYear(newBirth) || !isValidDateOrYear(newDeath)){
      showToast('Format tanggal harus tahun saja (cth: 1937) atau tanggal lengkap (cth: 1937-05-12).');
      return;
    }
    const newBirthPlace = document.getElementById('eBirthPlace').value.trim();
    const newBurialPlace = document.getElementById('eBurialPlace').value.trim();
    p.name = name;
    p.gender = document.getElementById('eGender').value;
    p.birthYear = newBirth;
    p.deathYear = newDeath;
    p.birthPlace = newBirthPlace;
    p.burialPlace = newBurialPlace;
    const removeCb = document.getElementById('eRemovePhoto');
    if(eNewPhoto){ p.photo = eNewPhoto; p.photoPosY = ePhotoPosY; }
    else if(removeCb && removeCb.checked){ p.photo = null; p.photoPosY = 50; }
    else{ p.photoPosY = ePhotoPosY; }
    const ok = await saveData([p.id]);
    if(!ok) return;
    closeModal(); render();
    showToast('Perubahan disimpan.');
  };
  document.getElementById('deleteBtn').onclick = async ()=>{
    if(!confirm('Hapus '+p.name+' dari pohon keluarga? Tindakan ini tidak bisa dibatalkan.')) return;

    const deletedId = p.id;
    const wasFocus = (deletedId === state.focusId);
    const wasActiveSpouse = (deletedId === state.activeSpouseId);
    // Simpan calon posisi pengganti SEBELUM data orang ini diubah/dihapus,
    // supaya kalau yang dihapus adalah fokus utama, kita tetap tinggal di
    // rumpun yang sama (pindah ke pasangan atau orang tuanya), bukan ke akar pohon.
    const fallbackSpouseId = (p.spouseIds||[]).find(sid=>sid!==deletedId && persons[sid]) || null;
    const fallbackParentId = p.fatherId || p.motherId || null;

    // unlink from spouses
    const affected = new Set();
    (p.spouseIds||[]).forEach(sid=>{
      if(persons[sid]){ persons[sid].spouseIds = (persons[sid].spouseIds||[]).filter(x=>x!==deletedId); affected.add(sid); }
    });
    // unlink children's parent reference
    Object.values(persons).forEach(c=>{
      if(c.fatherId===deletedId){ c.fatherId=null; affected.add(c.id); }
      if(c.motherId===deletedId){ c.motherId=null; affected.add(c.id); }
    });
    delete persons[deletedId];

    // Buang referensi ke orang yang sudah dihapus dari riwayat "Kembali"
    historyStack = historyStack.filter(id=>id!==deletedId && persons[id]);

    if(wasFocus){
      // Yang dihapus adalah kartu yang sedang difokuskan: pindah ke posisi
      // terdekat dalam rumpun yang sama (pasangan → orang tua → riwayat
      // sebelumnya). Hanya kalau semuanya tidak ada, baru kembali ke akar.
      let nextFocus = null;
      if(fallbackSpouseId) nextFocus = fallbackSpouseId;
      else if(fallbackParentId && persons[fallbackParentId]) nextFocus = fallbackParentId;
      else if(historyStack.length) nextFocus = historyStack.pop();
      state.focusId = nextFocus;
      state.activeSpouseId = nextFocus ? ((persons[nextFocus].spouseIds||[])[0] || null) : null;
    } else if(wasActiveSpouse){
      // Hanya pasangan aktif yang dihapus: tetap di orang yang sama,
      // cukup lepas pasangan yang sudah dihapus.
      state.activeSpouseId = (persons[state.focusId] && (persons[state.focusId].spouseIds||[])[0]) || null;
    }
    // Kalau yang dihapus adalah orang tua atau salah satu anak (bukan fokus
    // maupun pasangan aktif), posisi/rumpun yang sedang dilihat tidak berubah.

    // Perbarui tampilan LANGSUNG di sini — jangan menunggu proses simpan ke
    // server selesai dulu, supaya tidak terasa "diam"/perlu di-refresh manual.
    closeModal();
    render();
    showToast('Data telah dihapus.');

    // Kirim perubahan ke Google Sheet di belakang layar, tidak menahan tampilan.
    try{
      await deletePersonRemote(deletedId);
      await saveData(Array.from(affected));
    }catch(e){
      console.error("Gagal sinkron hapus ke server:", e);
      showToast('Terhapus di layar, tapi gagal sinkron ke server. Coba refresh untuk memastikan.');
    }
  };
}

/* ---------------- Export to Excel ---------------- */
document.getElementById('btnExport').onclick = exportToExcel;
document.getElementById('btnBirthdayToday').onclick = openBirthdayModal;
document.getElementById('btnCompleteness').onclick = openCompletenessDashboard;
const genderLabel = g => g==='L' ? 'Laki-laki' : (g==='P' ? 'Perempuan' : '');

async function exportToExcel(){
  // Utamakan ExcelJS supaya foto bisa ikut disisipkan ke dalam file Excel-nya.
  // Kalau ExcelJS gagal dimuat (misal koneksi lambat), tetap jatuh ke cara lama
  // (xlsx) tanpa foto, supaya ekspor data tetap bisa jalan.
  if(typeof ExcelJS !== 'undefined'){
    try{
      await exportToExcelWithPhotos();
      return;
    }catch(e){
      console.error('Ekspor dengan foto gagal, mencoba cara cadangan:', e);
    }
  }
  exportToExcelFallback();
}

async function exportToExcelWithPhotos(){
  showToast('Menyiapkan file Excel (menyertakan foto)...');
  const workbook = new ExcelJS.Workbook();
  const sheet = workbook.addWorksheet('Silsilah Keluarga');
  sheet.columns = [
    { header: 'ID', key: 'id', width: 10 },
    { header: 'Foto', key: 'foto', width: 12 },
    { header: 'Nama', key: 'nama', width: 26 },
    { header: 'Generasi', key: 'generasi', width: 10 },
    { header: 'Jenis Kelamin', key: 'gender', width: 14 },
    { header: 'Tanggal Lahir', key: 'lahir', width: 12 },
    { header: 'Tempat Lahir', key: 'tempatLahir', width: 18 },
    { header: 'Tanggal Wafat', key: 'wafat', width: 12 },
    { header: 'Usia', key: 'usia', width: 10 },
    { header: 'Tempat Dikuburkan', key: 'tempatKubur', width: 22 },
    { header: 'Nama Ayah', key: 'ayah', width: 26 },
    { header: 'Nama Ibu', key: 'ibu', width: 26 },
    { header: 'Pasangan', key: 'pasangan', width: 30 },
  ];
  sheet.getRow(1).font = { bold: true };

  const list = allPersonsList();
  list.forEach((p, i)=>{
    const father = getPerson(p.fatherId);
    const mother = getPerson(p.motherId);
    const spouseNames = spouses(p).map(s=>s.name).join(', ');
    const rowNum = i + 2; // baris 1 = header
    sheet.addRow({
      id: p.id,
      foto: '',
      nama: p.name,
      generasi: computeGeneration(p.id),
      gender: genderLabel(p.gender),
      lahir: formatDateDisplay(p.birthYear),
      tempatLahir: p.birthPlace || '',
      wafat: formatDateDisplay(p.deathYear),
      usia: p.birthYear ? (()=>{ const age = calcAge(p.birthYear, p.deathYear||null); return age!==null ? age+' th' : '-'; })() : '-',
      tempatKubur: p.deathYear ? (p.burialPlace || '') : '',
      ayah: father ? father.name : '',
      ibu: mother ? mother.name : '',
      pasangan: spouseNames
    });
    sheet.getRow(rowNum).height = 46;
    if(p.photo){
      try{
        const match = /^data:image\/(png|jpeg|jpg);base64,/.exec(p.photo);
        const ext = match ? (match[1]==='jpg'?'jpeg':match[1]) : 'jpeg';
        const imageId = workbook.addImage({ base64: p.photo, extension: ext });
        // kolom "Foto" adalah kolom ke-2 (index 1), baris rowNum (index rowNum-1)
        sheet.addImage(imageId, {
          tl: { col: 1.05, row: (rowNum-1) + 0.05 },
          ext: { width: 40, height: 40 }
        });
      }catch(imgErr){ console.error('Gagal menyisipkan foto untuk', p.name, imgErr); }
    }
  });

  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const today = new Date().toISOString().slice(0,10);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'silsilah-keluarga-'+today+'.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('File Excel (dengan foto) sedang diunduh.');
}

// Cara cadangan tanpa foto, dipakai kalau ExcelJS tidak tersedia.
function exportToExcelFallback(){
  if(typeof XLSX === 'undefined'){
    showToast('Gagal memuat modul Excel. Periksa koneksi internet lalu coba lagi.');
    return;
  }
  const rows = allPersonsList().map(p=>{
    const father = getPerson(p.fatherId);
    const mother = getPerson(p.motherId);
    const spouseNames = spouses(p).map(s=>s.name).join(', ');
    return {
      'ID': p.id,
      'Nama': p.name,
      'Generasi': computeGeneration(p.id),
      'Jenis Kelamin': genderLabel(p.gender),
      'Tanggal Lahir': formatDateDisplay(p.birthYear),
      'Tempat Lahir': p.birthPlace || '',
      'Tanggal Wafat': formatDateDisplay(p.deathYear),
      'Usia': p.birthYear ? (()=>{ const age = calcAge(p.birthYear, p.deathYear||null); return age!==null ? age+' th' : '-'; })() : '-',
      'Tempat Dikuburkan': p.deathYear ? (p.burialPlace || '') : '',
      'Nama Ayah': father ? father.name : '',
      'Nama Ibu': mother ? mother.name : '',
      'Pasangan': spouseNames
    };
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:10},{wch:26},{wch:10},{wch:14},{wch:12},{wch:14},{wch:12},{wch:10},{wch:22},{wch:26},{wch:26},{wch:30}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Silsilah Keluarga');
  const today = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, 'silsilah-keluarga-'+today+'.xlsx');
  showToast('File Excel sedang diunduh (tanpa foto — modul foto tidak tersedia).');
}

/* ---------------- Toast ---------------- */
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------------- Init ---------------- */
(async function init(){
  const status = await loadData(); // 'success' | 'empty' | 'error'
  if(status === 'empty'){
    // Server sudah konfirmasi memang belum ada data sama sekali di Sheet —
    // baru di sini aman untuk mengisi data contoh awal.
    seedData();
    await saveData();
  } else if(status === 'error'){
    // Gagal/timeout memuat data — JANGAN isi data contoh (itu akan menimpa
    // data asli kalau ternyata sebenarnya ada, cuma koneksi lagi lambat).
    // Biarkan pengguna refresh manual.
    showToast("Gagal memuat data dari server. Silakan refresh halaman ini.");
  }
  render();
})();
</script>
